name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  trigger-deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy at Render
        run: |
          echo "Triggering deploy for Render service ${{ secrets.RENDER_SERVICE_ID }}"
          curl -sS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /tmp/render-deploy-response.json || true
          echo "Response:"
          cat /tmp/render-deploy-response.json
